[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# API routes go to serverless functions first...
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ...everything else falls back to the SPA shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
